# Ajustado para equipos con poca RAM (6 GB): un solo JVM de Gradle y compilador Kotlin en proceso.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Backend desplegado. Para el backend local en el emulador: -PapiBaseUrl=http://10.0.2.2:8000/
apiBaseUrl=https://back-smartwatch-5d050b912b0a.herokuapp.com/
